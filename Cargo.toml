[workspace]
  resolver = "2"
  members = [
    "crates/ca-identity",
"crates/ca-service",
"crates/ca-region",
"crates/ca-topology",
"crates/ca-snapshot",
"crates/ca-scenario",
"crates/ca-loss",
"crates/ca-dro",
"crates/ca-plan",
"crates/ca-policy",
"crates/ca-events",
"crates/ca-ports",
"crates/ca-adapter-regorus",
"crates/ca-adapter-ruvector",
"crates/ca-adapter-rvf",
"crates/ca-evidence",
"crates/ca-recovery",
"crates/ca-application",
"crates/ca-config",
"crates/ca-telemetry",
"crates/ca-cli",
"crates/ca-evaluation"
  ]

  [workspace.package]
  version = "0.1.0"
  edition = "2024"
  license = "Apache-2.0"
  rust-version = "1.91"

  [workspace.dependencies]
  anyhow = "1.0"
  clap = { version = "4.5", features = ["derive"] }
  regorus = "=0.13.0"
  rvf-crypto = "=0.2.0"
  ruvector-core = "=2.4.0"
  serde = { version = "1.0", features = ["derive"] }
  serde_json = "1.0"
  sha2 = "0.10"
  tempfile = "3.23"
  thiserror = "2.0"
  tracing = "0.1"
  tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

  [workspace.lints.rust]
  unsafe_code = "forbid"
