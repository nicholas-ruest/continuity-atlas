<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Continuity Atlas control pipeline</title>
  <desc id="desc">A regional snapshot flows through RuVector recall, distributionally robust ranking, Regorus policy, and RVF evidence.</desc>
  <rect width="1200" height="320" rx="28" fill="#07172b"/>
  <text x="55" y="70" fill="#fff" font-family="sans-serif" font-size="42" font-weight="700">CONTINUITY ATLAS</text>
  <text x="55" y="108" fill="#8ed8ff" font-family="sans-serif" font-size="19">observe • stress • remember • authorize • recover</text>
  <g font-family="sans-serif" font-size="16" fill="#fff">
    <rect x="60" y="165" width="180" height="70" rx="14" fill="#153c5a"/>
    <text x="108" y="207">SNAPSHOT</text>
    <rect x="310" y="165" width="180" height="70" rx="14" fill="#25506a"/>
    <text x="349" y="207">RUVECTOR</text>
    <rect x="560" y="165" width="180" height="70" rx="14" fill="#24605d"/>
    <text x="601" y="207">DRO-CVaR</text>
    <rect x="810" y="165" width="180" height="70" rx="14" fill="#4b496d"/>
    <text x="855" y="207">REGORUS</text>
    <rect x="1015" y="165" width="130" height="70" rx="14" fill="#68446b"/>
    <text x="1064" y="207">RVF</text>
  </g>
  <path d="M240 200 H310 M490 200 H560 M740 200 H810 M990 200 H1015" fill="none" stroke="#45e0b5" stroke-width="4" stroke-dasharray="10 8">
    <animate attributeName="stroke-dashoffset" from="36" to="0" dur="1.6s" repeatCount="indefinite"/>
  </path>
  <circle r="7" fill="#45e0b5">
    <animateMotion dur="5s" repeatCount="indefinite" path="M240 200 H310 M490 200 H560 M740 200 H810 M990 200 H1015"/>
  </circle>
</svg>
